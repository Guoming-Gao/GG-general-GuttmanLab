[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spen-metagene"
version = "0.1.0"
description = "Reproducible SPEN 4sU/CLAP volcano-bin metagene analysis"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "seaborn", "pysam", "pyyaml"]

[project.scripts]
spen-metagene = "spen_metagene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

